<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" fill="none">
  <defs>
    <linearGradient id="backdrop" x1="116" y1="74" x2="675" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF2FF"/>
      <stop offset="1" stop-color="#DEE7FF"/>
    </linearGradient>
    <linearGradient id="fold" x1="415" y1="239" x2="600" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7296FF"/>
      <stop offset=".52" stop-color="#2456F5"/>
      <stop offset="1" stop-color="#173AB7"/>
    </linearGradient>
    <linearGradient id="fold-light" x1="417" y1="263" x2="567" y2="358" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6E2FF"/>
      <stop offset="1" stop-color="#7FA2FF"/>
    </linearGradient>
    <filter id="browser-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#233D83" flood-opacity=".16"/>
    </filter>
    <filter id="phone-shadow" x="-40%" y="-30%" width="190%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#182B65" flood-opacity=".23"/>
    </filter>
    <clipPath id="screen"><rect x="76" y="135" width="560" height="369" rx="8"/></clipPath>
    <clipPath id="phone-screen"><rect x="550" y="299" width="144" height="255" rx="15"/></clipPath>
  </defs>

  <!-- A quiet architectural backdrop holds the two screens together. -->
  <rect x="120" y="57" width="526" height="497" rx="48" fill="url(#backdrop)"/>
  <path d="M120 189V105C120 78.5 141.5 57 168 57H298" stroke="#C5D4FF" stroke-width="2"/>
  <path d="M472 554H598C624.5 554 646 532.5 646 506V456" stroke="#C5D4FF" stroke-width="2"/>
  <path d="M54 210H25M39.5 195.5V224.5M704 150H733M718.5 135.5V164.5" stroke="#91A9EF" stroke-width="2" stroke-linecap="round"/>

  <!-- A browser mockup, not an interactive interface. -->
  <g filter="url(#browser-shadow)">
    <rect x="76" y="101" width="560" height="403" rx="10" fill="#fff"/>
    <path d="M76 111C76 105.5 80.5 101 86 101H626C631.5 101 636 105.5 636 111V135H76V111Z" fill="#F7F8FB"/>
    <path d="M76 135H636" stroke="#E7EAF0"/>
    <circle cx="94" cy="118" r="3" fill="#C5CBD5"/>
    <circle cx="106" cy="118" r="3" fill="#C5CBD5"/>
    <circle cx="118" cy="118" r="3" fill="#C5CBD5"/>
    <rect x="235" y="111" width="242" height="14" rx="7" fill="#EBEEF4"/>
    <g clip-path="url(#screen)">
      <rect x="76" y="135" width="560" height="369" fill="#fff"/>
      <path d="M112 170L123 159L134 170L123 181Z" fill="#2456F5"/>
      <text x="144" y="176" fill="#1B2029" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">ВАШ БИЗНЕС</text>
      <path d="M552 166H590M552 174H590" stroke="#9AA2AF" stroke-width="2" stroke-linecap="round"/>
      <path d="M112 201H600" stroke="#E9ECF1"/>

      <text x="112" y="258" fill="#1B2029" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6">Идея,</text>
      <text x="112" y="306" fill="#1B2029" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6">которая</text>
      <text x="112" y="354" fill="#2456F5" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.6">работает.</text>
      <text x="114" y="392" fill="#6F7786" font-family="Arial, sans-serif" font-size="15">Пространство для вашего дела</text>
      <path d="M114 419H285" stroke="#2456F5" stroke-width="2"/>
      <text x="114" y="447" fill="#1B2029" font-family="Arial, sans-serif" font-size="15" font-weight="700">Продумано до деталей</text>
      <path d="M114 474H600" stroke="#E9ECF1"/>

      <!-- An original folded-ribbon motif, echoed on the smaller screen. -->
      <path d="M419 302C419 258 455 222 499 222H579V302C579 346 543 382 499 382H419V302Z" fill="url(#fold)"/>
      <path d="M419 302C419 258 455 222 499 222H579L499 302H419Z" fill="url(#fold-light)"/>
      <path d="M419 382L499 302H579C579 346 543 382 499 382H419Z" fill="#193FCB"/>
      <path d="M419 382L499 302L579 222" stroke="#fff" stroke-opacity=".48" stroke-width="1.5"/>
    </g>
  </g>

  <!-- The same visual language adapts to a narrow screen. -->
  <g filter="url(#phone-shadow)">
    <rect x="541" y="290" width="162" height="273" rx="23" fill="#202631"/>
    <rect x="550" y="299" width="144" height="255" rx="15" fill="#fff"/>
    <g clip-path="url(#phone-screen)">
      <path d="M566 330L573 323L580 330L573 337Z" fill="#2456F5"/>
      <path d="M661 326H678M661 333H678" stroke="#8A93A3" stroke-width="2" stroke-linecap="round"/>
      <path d="M566 350H678" stroke="#E9ECF1"/>
      <text x="566" y="381" fill="#1B2029" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-.6">Идея,</text>
      <text x="566" y="405" fill="#1B2029" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-.6">которая</text>
      <text x="566" y="429" fill="#2456F5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-.6">работает.</text>
      <path d="M566 501C566 475 587 454 613 454H678V493C678 519 657 540 631 540H566V501Z" fill="url(#fold)"/>
      <path d="M566 501C566 475 587 454 613 454H678L631 501H566Z" fill="url(#fold-light)"/>
      <path d="M566 540L631 501H678C674 523 655 540 631 540H566Z" fill="#193FCB"/>
    </g>
    <rect x="602" y="304" width="40" height="5" rx="2.5" fill="#202631"/>
  </g>
</svg>